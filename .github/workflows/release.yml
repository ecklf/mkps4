name: Build release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            architecture: arm64
            bundle: app
            artifact: mkps4-macos-apple-silicon
          - name: Linux x86_64
            runner: ubuntu-24.04
            architecture: x86_64
            bundle: appimage
            artifact: mkps4-linux-x86_64
          - name: Windows x86_64
            runner: windows-2025
            architecture: x86_64
            bundle: nsis
            artifact: mkps4-windows-x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/mkps4-gui/pnpm-lock.yaml

      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install frontend dependencies
        run: pnpm --dir apps/mkps4-gui install --frozen-lockfile

      - name: Build native PkgTool
        shell: bash
        run: scripts/build-pkgtool.sh

      - name: Build CLI
        run: cargo build --release -p mkps4

      - name: Build Tauri application
        run: pnpm --dir apps/mkps4-gui tauri build --bundles ${{ matrix.bundle }}

      - name: Package macOS application
        if: runner.os == 'macOS'
        env:
          ARCHIVE_NAME: mkps4-macos-apple-silicon.zip
        run: |
          app="target/release/bundle/macos/mkps4.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p release
          staging="$(mktemp -d)"
          ditto "$app" "$staging/mkps4.app"
          cat > "$staging/TROUBLESHOOTING.md" <<'EOF'
          # Opening mkps4 on macOS

          mkps4 is ad-hoc signed but not Apple-notarized.

          1. Move mkps4.app to /Applications.
          2. Open Terminal and run:

             ```sh
             xattr -rc /Applications/mkps4.app
             ```

          3. Open mkps4 from /Applications.
          EOF
          ditto -c -k --sequesterRsrc "$staging" "release/$ARCHIVE_NAME"
          rm -rf "$staging"
          cli_staging="$(mktemp -d)"
          cp "target/release/mkps4" "$cli_staging/mkps4"
          cp "target/pkgtool/PkgTool.Core" "$cli_staging/PkgTool.Core"
          cp "LICENSE" "THIRD_PARTY_NOTICES.md" "$cli_staging/"
          ditto -c -k --sequesterRsrc "$cli_staging" "release/mkps4-cli-macos-apple-silicon.zip"
          rm -rf "$cli_staging"
          (
            cd release
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
            shasum -a 256 "mkps4-cli-macos-apple-silicon.zip" > "mkps4-cli-macos-apple-silicon.zip.sha256"
          )

      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          appimages=(target/release/bundle/appimage/*.AppImage)
          test -f "${appimages[0]}"
          cp "${appimages[0]}" "release/mkps4-linux-x86_64.AppImage"
          chmod +x "release/mkps4-linux-x86_64.AppImage"
          cli_staging="$(mktemp -d)"
          cp "target/release/mkps4" "$cli_staging/mkps4"
          cp "target/pkgtool/PkgTool.Core" "$cli_staging/PkgTool.Core"
          cp "LICENSE" "THIRD_PARTY_NOTICES.md" "$cli_staging/"
          tar -C "$cli_staging" -czf "release/mkps4-cli-linux-x86_64.tar.gz" .
          rm -rf "$cli_staging"
          (
            cd release
            sha256sum "mkps4-linux-x86_64.AppImage" > "mkps4-linux-x86_64.AppImage.sha256"
            sha256sum "mkps4-cli-linux-x86_64.tar.gz" > "mkps4-cli-linux-x86_64.tar.gz.sha256"
          )

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem "target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Tauri did not create an NSIS installer"
          }
          $name = "mkps4-windows-x86_64-setup.exe"
          $destination = Join-Path release $name
          Copy-Item $installer.FullName $destination
          $cliStaging = Join-Path $env:RUNNER_TEMP "mkps4-cli"
          New-Item -ItemType Directory -Force -Path $cliStaging | Out-Null
          Copy-Item "target/release/mkps4.exe" (Join-Path $cliStaging "mkps4.exe")
          Copy-Item "target/pkgtool/PkgTool.Core.exe" (Join-Path $cliStaging "PkgTool.Core.exe")
          Copy-Item "LICENSE" (Join-Path $cliStaging "LICENSE")
          Copy-Item "THIRD_PARTY_NOTICES.md" (Join-Path $cliStaging "THIRD_PARTY_NOTICES.md")
          $cliArchive = Join-Path release "mkps4-cli-windows-x86_64.zip"
          Compress-Archive -Path "$cliStaging/*" -DestinationPath $cliArchive
          Get-ChildItem release -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read release version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --quiet | jq -r '.packages[] | select(.name == "mkps4") | .version')"
          test -n "$version"
          test "$version" != "null"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          disclaimer=$'### Disclaimer\n\nThis software is provided **as is**, without warranty of any kind. The authors and contributors are not liable for hardware or software damage, data loss, account or console issues, or any other damages arising from its use. Use mkps4 entirely at your own risk.'
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            body="$(gh release view "$TAG" --repo "$REPOSITORY" --json body --jq .body)"
            if [[ "$body" != *"This software is provided **as is**"* ]]; then
              gh release edit "$TAG" --repo "$REPOSITORY" --notes "${body}"$'\n\n'"${disclaimer}"
            fi
            gh release upload "$TAG" release/* --clobber --repo "$REPOSITORY"
          else
            notes=$'### Downloads\n\nGUI and self-contained CLI assets are available for macOS Apple Silicon, Linux x86_64, and Windows x86_64. The Windows builds are currently unverified.\n\n### Opening the macOS app\n\nThe macOS build is ad-hoc signed but not Apple-notarized. After moving it to `/Applications`, run:\n\n```sh\nxattr -rc /Applications/mkps4.app\n```'
            notes+=$'\n\n'
            notes+="$disclaimer"
            args=(
              "$TAG"
              release/*
              --repo "$REPOSITORY"
              --target "$TARGET"
              --title "mkps4 $VERSION"
              --notes "$notes"
              --generate-notes
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
