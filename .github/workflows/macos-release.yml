name: Build macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Apple Silicon
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.10.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/mkps4-gui/pnpm-lock.yaml

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Install frontend dependencies
        run: pnpm --dir apps/mkps4-gui install --frozen-lockfile

      - name: Build native PkgTool
        run: scripts/build-pkgtool.sh

      - name: Build Tauri application
        run: pnpm --dir apps/mkps4-gui tauri build

      - name: Sign and package application
        env:
          ARCHIVE_NAME: mkps4-macos-apple-silicon.zip
        run: |
          app="target/release/bundle/macos/mkps4.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p release
          staging="$(mktemp -d)"
          ditto "$app" "$staging/mkps4.app"
          cat > "$staging/TROUBLESHOOTING.md" <<'EOF'
          # Opening mkps4 on macOS

          mkps4 is ad-hoc signed but not Apple-notarized.

          1. Move mkps4.app to /Applications.
          2. Open Terminal and run:

             ```sh
             xattr -rc /Applications/mkps4.app
             ```

          3. Open mkps4 from /Applications.
          EOF
          ditto -c -k --sequesterRsrc "$staging" "release/$ARCHIVE_NAME"
          rm -rf "$staging"
          (
            cd release
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkps4-macos-apple-silicon
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$REPOSITORY"
          else
            notes=$'### Opening the app\n\nThis build is ad-hoc signed but not Apple-notarized. After moving it to `/Applications`, run:\n\n```sh\nxattr -rc /Applications/mkps4.app\n```'
            args=(
              "$TAG"
              release/*
              --repo "$REPOSITORY"
              --target "$TARGET"
              --title "mkps4 $TAG"
              --notes "$notes"
              --generate-notes
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
